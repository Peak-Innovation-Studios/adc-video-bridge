# Alarm.com credentials belong in .env (or ADC_*_FILE Docker secrets), not in
# this mounted configuration file. Copy .env.example to .env and protect it.

# Run "npx tsx src/discover.ts" to find your camera IDs and names
cameras:
  - id: "100654376-1079"
    name: "front-door"
    homebridgeName: "Front Door"  # must match the camera name in homebridge-camera-ffmpeg
    quality: "hd"  # hd or sd
    # OPTIONAL - the camera's own RTSP stream, tunnelled over HTTPS.
    #
    # Present = this camera is served by the local relay and is NOT started on
    # the WebRTC path. That exclusion is deliberate: both publish into the same
    # go2rtc stream name, and running both does not error, it interleaves.
    #
    # 🔑 Local RTSP is the ONLY path for ADC-V515 cameras, which report
    # SupportsWebRTC: false and can never be served over WebRTC by any fix.
    #
    # host/port come from the mobile API's LocalRtspEndpoint - a per-camera
    # HIGH port, not 554. There are deliberately no credentials here: the relay
    # passes the camera's own Digest challenge through, so the camera username
    # and password go in go2rtc.yaml's stream URL instead. See docs/SETUP.md.
    # localRtsp:
    #   host: "192.168.1.20"
    #   port: 40001
    #   listenPort: 8561      # must be inside ADC_BRIDGE_RTSP_PORTS in .env
    #   # path: "/s1"         # default; every camera seen so far serves /s1
  # - id: "100652375-2049"
  #   name: "backyard"
  #   homebridgeName: "Backyard"
  #   quality: "hd"
  #   localRtsp: { host: "192.168.1.21", port: 40002, listenPort: 8562 }

# Shared settings for the local RTSP relays. Only read when at least one camera
# has a localRtsp block.
# ⚠️ bindAddress is the address INSIDE the container, same as status.bindAddress
# below - the host's LAN address does not exist on the default bridge network.
# Confinement comes from compose's ports: mapping.
#localRtsp:
#  bindAddress: "0.0.0.0"
#  maxConnections: 8

# go2rtc runs in its own container on network_mode: host; this bridge stays
# on the default Docker network, so "localhost" here means the bridge's own
# container, not the host go2rtc listens on. Use the host's real LAN
# address instead - the same address set for ADC_BRIDGE_BIND_ADDRESS in
# .env. That variable's 127.0.0.1 default will not work here either: a
# bridge-network container cannot reach the host's loopback.
go2rtc:
  apiUrl: "http://192.168.1.10:1984"
  rtspPort: 8554
  # Drive go2rtc's native HomeKit motion sensor. Requires `motion: api` under
  # the matching `homekit:` entry in go2rtc.yaml. Independent of
  # homebridge.motionUrl below — during the cutover both accessories exist and
  # both need telling; afterwards the Homebridge one simply goes away.
  # go2rtc keys its HomeKit server by the camera's `name`, not `homebridgeName`.
  homekitMotion: false
# Optional: send motion events to homebridge-camera-ffmpeg
# Requires "motion": true and "porthttp" set in the Homebridge plugin config
# homebridge:
#   motionUrl: "http://10.0.0.50:8080"  # homebridge-camera-ffmpeg HTTP server
#   motionTimeoutMs: 60000               # reset motion after 60s of no activity

logging:
  level: "info"  # debug, info, warn, error

# Optional read-only status endpoint, so diagnosing the bridge does not require
# `docker-compose logs` (and therefore sudo) on the deployment host. Omit this
# whole block to keep the bridge listening on nothing, which is the default.
# ⚠️ bindAddress is the address INSIDE the container. The bridge runs on the
# default bridge network, where the host's LAN address does NOT exist — binding
# it there fails with EADDRNOTAVAIL and you get no endpoint. Use "0.0.0.0";
# confinement comes from compose's ports: mapping, which binds the host side to
# ADC_BRIDGE_BIND_ADDRESS. Credentials are its OWN, not the go2rtc or Alarm.com
# ones, so a leak here cannot move laterally — set STATUS_USERNAME/PASSWORD.
#status:
#  bindAddress: "0.0.0.0"
#  port: 9090
