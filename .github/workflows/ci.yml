name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run audit:prod
      - run: docker build --tag adc-video-bridge:test .
      - run: >-
          docker run --rm --entrypoint sh adc-video-bridge:test -c
          'test "$(id -u)" -ne 0 && command -v node && command -v ffmpeg && command -v curl'
      - run: docker build -f Dockerfile.go2rtc -t go2rtc-hksv:test .
      - run: docker run --rm --entrypoint go2rtc go2rtc-hksv:test --version
